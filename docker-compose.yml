services:
  db:
    image: postgres:15
    container_name: barbearia-db
    restart: always
    environment:
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: barbearia
      POSTGRES_DB: barbearia
    ports:
      - "5435:5432"
    volumes: # <--- A SEÇÃO DE VOLUMES JÁ ESTÁ AQUI, O QUE É ÓTIMO!
      - postgres_data:/var/lib/postgresql/data

  # O serviço 'app' foi comentado para não iniciar junto com o Docker
  # app:
  #   build: .
  #   container_name: barbearia-app
  #   restart: always
  #   depends_on:
  #     - db
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5435/barbearia
  #     SPRING_DATASOURCE_USERNAME: barbearia
  #     SPRING_DATASOURCE_PASSWORD: barbearia
  #     SPRING_JPA_HIBERNATE_DDL_AUTO: update

# ESTA SEÇÃO NO FINAL É CRUCIAL. GARANTA QUE ELA EXISTA.
volumes:
  postgres_data: